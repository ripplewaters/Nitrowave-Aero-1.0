[package]
name = "nitrowave"
version = "1.0.0"
description = "Nitrowave Aero — Digital Personal Media System"
authors = ["Nitrowave"]
edition = "2021"

[lib]
name = "nitrowave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
wasapi = "0.25"
windows = { version = "0.62", features = ["Media_Control", "Foundation"] }

[profile.release]
panic = "abort"
codegen-units = 16
lto = false
strip = true
opt-level = "s"
